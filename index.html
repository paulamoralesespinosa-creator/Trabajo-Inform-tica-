<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paula Morales Espinosa | Trabajo Social UCA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Tira superior informativa */
        .announcement-bar {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 8px 16px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Encabezado principal */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #000000;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #000000;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 0.5;
        }

        /* Contenido principal */
        main {
            flex: 1;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 12px;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            color: #666666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
        }

        /* Tarjeta de presentación */
        .author-card {
            border: 1px solid #000000;
            padding: 24px 40px;
            text-align: center;
            margin-bottom: 50px;
            width: 100%;
            max-width: 600px;
        }

        .author-card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .author-card p {
            font-size: 0.75rem;
            color: #555555;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Sección de Vídeo */
        .video-section {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #f5f5f5;
            margin-bottom: 24px;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botón estilo Stradivarius */
        .btn-stradivarius {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 14px 32px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border: 1px solid #000000;
        }

        .btn-stradivarius:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Pie de página */
        footer {
            border-top: 1px solid #e5e5e5;
            padding: 30px 20px;
            text-align: center;
            font-size: 0.7rem;
            color: #888888;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .hero-title {
                font-size: 1.6rem;
            }

            .author-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="announcement-bar">
        Grado en Trabajo Social &bull; Universidad de Cádiz (UCA)
    </div>

    <header>
        <a href="#" class="logo">PAULA MORALES</a>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Proyecto</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="hero-title">¡Hola, mundo!</h1>
        <p class="hero-subtitle">Este es el contenido visible de mi sitio web</p>

        <div class="author-card">
            <h2>Paula Morales Espinosa</h2>
            <p> Estudiante de 4º Curso &bull; Universidad de Cádiz</p>
        </div>

        <section class="video-section">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/zJOaqPMHs7Y" 
                    title="Reproductor de vídeo" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <a class="btn-stradivarius" href="https://www.youtube.com/live/zJOaqPMHs7Y?si=Ifpcj97UwvLVU9db" target="_blank" rel="noopener noreferrer">
                Ver en YouTube
            </a>
        </section>
    </main>

    <footer>
        &copy; Paula Morales Espinosa &bull; Trabajo Social UCA
    </footer>

</body>
</html>
